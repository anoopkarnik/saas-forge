name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  template-sync:
    name: Template Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify template sync
        run: pnpm template:check-sync

  scaffold-matrix:
    name: Scaffold Variant Matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true
          cache: pnpm
      # Fills the pnpm store so each variant installs with --prefer-offline.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Compile and check variants (pairwise)
        run: pnpm scaffold:matrix
      - name: Upload matrix summary and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scaffold-matrix
          path: |
            .generated/variants/summary.md
            .generated/variants/*.log
          if-no-files-found: ignore

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm generate
      # Python backend runs in its own uv-based jobs below.
      - name: Lint
        run: pnpm turbo run lint --filter='!@workspace/backend'

  architecture:
    name: Architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check import direction and cycles
        run: pnpm arch:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm generate
      # Python backend runs in its own uv-based jobs below.
      - name: Typecheck
        run: pnpm turbo run typecheck --filter='!@workspace/backend'

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm generate
      # Python backend runs in its own uv-based jobs below.
      - name: Test
        run: pnpm turbo run test --filter='!@workspace/backend'

  web-build:
    name: Web Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm generate
      - name: Build web app
        run: pnpm --dir apps/web build

  docker-web-build:
    name: Docker Web Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true
      - name: Build web image
        run: pnpm docker:build:web

  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync deps
        working-directory: apps/backend
        run: uv sync --frozen
      - name: Ruff
        working-directory: apps/backend
        run: uv run ruff check src tests

  backend-typecheck:
    name: Backend Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync deps
        working-directory: apps/backend
        run: uv sync --frozen
      - name: Pyright
        working-directory: apps/backend
        run: uv run pyright

  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync deps
        working-directory: apps/backend
        run: uv sync --frozen
      - name: Pytest
        working-directory: apps/backend
        run: uv run pytest -q

  docker-backend-build:
    name: Docker Backend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build api image
        run: docker build -f Dockerfile.backend --target api -t saas-forge-backend:api .
