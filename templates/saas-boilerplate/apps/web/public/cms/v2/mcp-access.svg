<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="mcp-access-title mcp-access-desc"><title id="mcp-access-title">Your account, through scoped tools.</title><desc id="mcp-access-desc">Available tools follow the installed modules. Credit-spending actions stay outside the model.</desc><defs><marker id="mcp-access-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#a1a1aa"/></marker><pattern id="mcp-access-grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#27272a"/></pattern></defs><rect width="1600" height="900" fill="#09090b"/><rect width="1600" height="900" fill="url(#mcp-access-grid)"/><text x="80" y="76" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="600" fill="#00c950">SAAS FORGE / PLATFORM GUIDE</text><text x="80" y="145" font-family="DejaVu Sans, sans-serif" font-size="48" font-weight="600" fill="#fafafa">Your account, through scoped tools.</text><text x="80" y="194" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#a1a1aa">Read-only product context for connected AI clients.</text><path d="M800 384 L800 438" fill="none" stroke="#a1a1aa" stroke-width="2" marker-end="url(#mcp-access-arrow)"/><path d="M800 572 L800 626" fill="none" stroke="#a1a1aa" stroke-width="2" marker-end="url(#mcp-access-arrow)"/><rect x="500" y="260" width="600" height="124" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/><text x="524" y="306" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="600" fill="#fafafa">AI client</text><text x="524" y="346" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa">Scoped API key</text><rect x="500" y="448" width="600" height="124" rx="8" fill="#10251a" stroke="#00c950" stroke-width="2"/><text x="524" y="494" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="600" fill="#fafafa">MCP endpoint</text><text x="524" y="534" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa">Authenticate · validate · authorize</text><rect x="500" y="636" width="600" height="124" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/><text x="524" y="682" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="600" fill="#fafafa">Account services</text><text x="524" y="722" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa">Only the key owner’s permitted data</text><path d="M80 825 H1520" stroke="#3f3f46"/><text x="80" y="862" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa">Available tools follow the installed modules. Credit-spending actions stay outside the model.</text></svg>