<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="event-delivery-title event-delivery-desc"><title id="event-delivery-title">Commit first. Deliver after.</title><desc id="event-delivery-desc">Inngest provides durable retries. Without it, the inline fallback has different delivery guarantees.</desc><defs><marker id="event-delivery-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#a1a1aa"/></marker><pattern id="event-delivery-grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#27272a"/></pattern></defs><rect width="1600" height="900" fill="#09090b"/><rect width="1600" height="900" fill="url(#event-delivery-grid)"/><text x="80" y="76" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="600" fill="#00c950">SAAS FORGE / PLATFORM GUIDE</text><text x="80" y="145" font-family="DejaVu Sans, sans-serif" font-size="48" font-weight="600" fill="#fafafa">Commit first. Deliver after.</text><text x="80" y="194" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#a1a1aa">A shared workflow for product notifications and outgoing events.</text><path d="M580 384 V402 Q580 410 572 410 H533 Q525 410 525 418 V438" fill="none" stroke="#a1a1aa" stroke-width="2" marker-end="url(#event-delivery-arrow)"/><path d="M1020 384 V402 Q1020 410 1028 410 H1067 Q1075 410 1075 418 V438" fill="none" stroke="#a1a1aa" stroke-width="2" marker-end="url(#event-delivery-arrow)"/><path d="M525 572 V590 Q525 598 533 598 H562 Q570 598 570 606 V626" fill="none" stroke="#a1a1aa" stroke-width="2" marker-end="url(#event-delivery-arrow)"/><path d="M1075 572 V590 Q1075 598 1067 598 H1038 Q1030 598 1030 606 V626" fill="none" stroke="#a1a1aa" stroke-width="2" marker-end="url(#event-delivery-arrow)"/><rect x="500" y="260" width="600" height="124" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/><text x="524" y="306" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="600" fill="#fafafa">Product change</text><text x="524" y="346" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa">Commit application data</text><rect x="270" y="448" width="510" height="124" rx="8" fill="#10251a" stroke="#00c950" stroke-width="2"/><text x="294" y="494" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="600" fill="#fafafa">Notification</text><text x="294" y="534" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa">Inbox + preferences</text><rect x="820" y="448" width="510" height="124" rx="8" fill="#10251a" stroke="#00c950" stroke-width="2"/><text x="844" y="494" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="600" fill="#fafafa">Outgoing event</text><text x="844" y="534" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa">Versioned payload</text><rect x="500" y="636" width="600" height="124" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/><text x="524" y="682" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="600" fill="#fafafa">Delivery jobs</text><text x="524" y="722" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa">Email + signed webhook delivery</text><path d="M80 825 H1520" stroke="#3f3f46"/><text x="80" y="862" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa">Inngest provides durable retries. Without it, the inline fallback has different delivery guarantees.</text></svg>