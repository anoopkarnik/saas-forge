# Secrets have no defaults: put BETTER_AUTH_SECRET in a .env file next to this
# compose file (Compose loads it automatically).
# scaffold:begin ai_agents
# The AI agents backend also needs BACKEND_HMAC_SECRET in that file.
# scaffold:end ai_agents
# The images run in production mode and refuse to boot with weak secrets.

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: saas_forge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d saas_forge"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # scaffold:begin ai_agents
      backend-api:
        condition: service_started
      # scaffold:end ai_agents
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/saas_forge
      NEXT_PUBLIC_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env (openssl rand -base64 32)}
      # scaffold:begin ai_agents
      BACKEND_URL: http://backend-api:8000
      BACKEND_HMAC_SECRET: ${BACKEND_HMAC_SECRET:?set BACKEND_HMAC_SECRET in .env (openssl rand -hex 32)}
      # scaffold:end ai_agents
    ports:
      - "${WEB_PORT:-3000}:3000"

  # scaffold:begin ai_agents
  backend-api:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      APP_ENV: production
      BACKEND_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/saas_forge
      REDIS_URL: redis://redis:6379/0
      BACKEND_HMAC_SECRET: ${BACKEND_HMAC_SECRET:?set BACKEND_HMAC_SECRET in .env (openssl rand -hex 32)}
      LOG_FORMAT: ${LOG_FORMAT:-pretty}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RAG_VECTOR_STORE: ${RAG_VECTOR_STORE:-pgvector}
      RAG_EMBEDDER: ${RAG_EMBEDDER:-openai:text-embedding-3-small}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
    expose:
      - "8000"
    # NOTE: backend-api is internal-only per spec decision #4 — no `ports:` here.
    # For local smoke testing against /healthz, exec `curl` inside the container
    # (e.g. `docker compose exec backend-api curl localhost:8000/healthz`) or
    # use web's proxy at /api/ai/agents/.../stream. Do not re-add a host-port
    # mapping; the backend's only legitimate ingress is `web`.

  backend-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      APP_ENV: production
      BACKEND_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/saas_forge
      REDIS_URL: redis://redis:6379/0
      BACKEND_HMAC_SECRET: ${BACKEND_HMAC_SECRET:?set BACKEND_HMAC_SECRET in .env (openssl rand -hex 32)}
      LOG_FORMAT: ${LOG_FORMAT:-pretty}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RAG_VECTOR_STORE: ${RAG_VECTOR_STORE:-pgvector}
      RAG_EMBEDDER: ${RAG_EMBEDDER:-openai:text-embedding-3-small}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
  # scaffold:end ai_agents

volumes:
  postgres-data:
  redis-data:
